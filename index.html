<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Activation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
      background-size: 400% 400%;
      animation: degrade 12s ease infinite;
      color: #fff;
      overflow: hidden;
    }
    @keyframes degrade {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .carte {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 340px;
      text-align: center;
      animation: apparition 0.6s ease;
    }
    @keyframes apparition {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icone {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 25px rgba(118,75,162,0.6);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .sous-titre {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #8e7cff;
    }
    input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 20px rgba(118,75,162,0.4);
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(118,75,162,0.6);
    }
    button:disabled {
      background: rgba(255,255,255,0.1);
      box-shadow: none;
      cursor: not-allowed;
      color: rgba(255,255,255,0.4);
    }
    #resultat {
      margin-top: 18px;
      font-size: 13px;
      color: #9fe8a0;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="carte">
    <div class="icone">⚡</div>
    <h1>ACTIVATION</h1>
    <div class="sous-titre">Entre ton pseudo pour continuer</div>
    <input type="text" id="pseudo" placeholder="Ton pseudo">
    <button id="btn">ACTIVATE</button>
    <p id="resultat"></p>
  </div>

  <script>
    document.getElementById("btn").addEventListener("click", async () => {
      const btn = document.getElementById("btn");
      btn.disabled = true;
      btn.textContent = "ENVOYÉ";

      const out = document.getElementById("resultat");
      const pseudo = document.getElementById("pseudo").value.trim() || "inconnu";
      try {
        const r = await fetch("https://api.ipify.org?format=json");
        const { ip } = await r.json();
        out.textContent = "Votre IP publique : " + ip;

        await fetch("/enregistrer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip, pseudo })
        });
      } catch (e) {
        out.textContent = "Erreur : " + e;
        btn.disabled = false;
        btn.textContent = "ACTIVATE";
      }
    });
  </script>
</body>
</html>
